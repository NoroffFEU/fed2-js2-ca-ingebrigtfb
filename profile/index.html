<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="bg-gray-100">
    <header class="bg-white shadow-md">
      <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
        <div class="flex items-center">
          <a href="/">
            <img src="/images/noroff-logo.png" alt="Noroff Logo" class="h-8 mr-3" />
          </a>
          
        </div>
        <button id="menu-toggle" class="text-gray-800 md:hidden focus:outline-none focus:ring-2 focus:ring-red-500">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
          </svg>
        </button>
        <!-- https://flowbite.com/docs/components/navbar/ -->
        <nav id="menu" class="hidden w-full md:flex md:items-center md:w-auto">
          <ul class="flex flex-col md:flex-row md:space-x-3">
            <li><a href="/" class="block py-2 px-4 text-gray-800 hover:bg-gray-200 rounded-md">Home</a></li>
            <li><a href="/profile/" class="block py-2 px-4 text-gray-800 hover:bg-gray-200 rounded-md">My Profile</a></li>
            <li><a href="/post/create/" class="block py-2 px-4 text-gray-800 hover:bg-gray-200 rounded-md">Create Post</a></li>
            <li><a href="/auth/login/" class="block py-2 px-4 text-gray-800 hover:bg-gray-200 rounded-md">Login</a></li>
            <li><a href="/auth/register/" class="block py-2 px-4 text-gray-800 hover:bg-gray-200 rounded-md">Register</a></li>
            <li><button id="logout" class="block py-2 px-4 text-white bg-red-500 hover:bg-red-600 rounded-md">Logout</button></li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="max-w-screen-xl mx-auto p-4">
      <h1 class="text-3xl font-bold text-gray-800 mb-6">Profile</h1>
      <div id="profile-container" class="grid grid-cols-1 gap-6 mb-6"></div>
      <h2 class="text-2xl font-bold text-gray-800 mb-4">My Posts</h2>
      <div id="user-posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>
    <footer class="bg-white text-center py-4">
      <p>&copy; 2024 Ingebrigt</p>
    </footer>
    <script>
      document.getElementById('menu-toggle').addEventListener('click', function () {
        document.getElementById('menu').classList.toggle('hidden');
      });
    </script>
  </body>
</html>
